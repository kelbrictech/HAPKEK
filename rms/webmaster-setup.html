<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HAPKEK — Webmaster setup</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#17120f;color:#f6e9d9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#57311f 0,transparent 55%),#17120f}
main{width:min(100%,440px);border:1px solid #805339;border-radius:22px;padding:28px;background:#241914;box-shadow:0 22px 70px #0008}
.brand{font-size:12px;letter-spacing:.24em;font-weight:900;color:#f4b65d}
h1{margin:12px 0 8px;font-size:30px}
p{color:#cbb9a8;line-height:1.55}
label{display:block;font-size:13px;font-weight:700;margin:22px 0 8px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #80604b;background:#140f0c;color:#fff;font-size:22px;letter-spacing:.35em;outline:none}
button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:#f0a34b;color:#29170e;font-weight:900;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#status{min-height:24px;font-size:13px;margin-top:16px;color:#f5c58b}
.note{font-size:12px;color:#aa9786}
</style>
</head>
<body>
<main>
<div class="brand">HAPKEK · SECURE SETUP</div>
<h1>Activate Webmaster</h1>
<p>Create the initial owner login. Your temporary PIN is stored as a one-way password hash and must be changed immediately after your first sign-in.</p>
<form id="setup">
<label for="pin">Four-digit temporary PIN</label>
<input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" required>
<button id="submit" type="submit">Create Webmaster account</button>
</form>
<div id="status" role="status" aria-live="polite"></div>
<p class="note">This one-time setup link stops working once the Webmaster account has been created.</p>
</main>
<script>
(() => {
 const API = "https://api.kelbric.com";
 const token = location.hash.startsWith("#") ? decodeURIComponent(location.hash.slice(1)) : "";
 history.replaceState(null,"",location.pathname);
 const form = document.getElementById("setup");
 const pin = document.getElementById("pin");
 const button = document.getElementById("submit");
 const status = document.getElementById("status");
 if (!token) {
   status.textContent = "This setup link is missing its one-time authorization. Open the full link provided by the administrator.";
   button.disabled = true;
 }
 form.addEventListener("submit", async event => {
   event.preventDefault();
   if (!token || !/^[0-9]{4}$/.test(pin.value)) {
     status.textContent = "Enter a valid four-digit temporary PIN.";
     return;
   }
   button.disabled = true;
   status.textContent = "Creating the owner account securely…";
   try {
     const response = await fetch(API + "/api/webmaster/bootstrap", {
       method:"POST",
       headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
       body:JSON.stringify({temporaryPin:pin.value}),
       cache:"no-store"
     });
     const data = await response.json().catch(()=>({}));
     if (!response.ok) throw new Error(data.error || "Setup failed");
     pin.value = "";
     status.textContent = "Webmaster account created. Open the RMS dashboard and sign in as Webmaster using your temporary PIN. You will be required to change it.";
     form.hidden = true;
   } catch(error) {
     status.textContent = error.message || "Could not complete setup. Check the link and try again.";
     button.disabled = false;
   }
 });
})();
</script>
</body>
</html>
