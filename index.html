<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8d7b4">
<title>HAPKEK Japanese Cake — Memory Game</title>
<link rel="stylesheet" href="src/css/styles.css">
<link rel="stylesheet" href="src/css/animations.css">
</head>
<body><main class="app"><div class="stage">
<svg id="gameSvg" viewBox="0 0 1024 1536" role="img" aria-label="HAPKEK Japanese Cake Memory Game">
<defs>
 <linearGradient id="griddle" x2="0" y2="1"><stop stop-color="#6c5049"/><stop offset=".22" stop-color="#34221f"/><stop offset=".85" stop-color="#241715"/><stop offset="1" stop-color="#805c52"/></linearGradient>
 <linearGradient id="cakeGold" x2="0" y2="1"><stop stop-color="#ffbf35"/><stop offset=".65" stop-color="#f28a08"/><stop offset="1" stop-color="#d66b00"/></linearGradient>
 <linearGradient id="cakeWin" x2="0" y2="1"><stop stop-color="#d18a43"/><stop offset="1" stop-color="#8b4d1f"/></linearGradient>
 <linearGradient id="creamButton" x2="0" y2="1"><stop stop-color="#fff9e9"/><stop offset=".75" stop-color="#ffe5b6"/><stop offset="1" stop-color="#e9a44b"/></linearGradient>
 <linearGradient id="redButton" x2="0" y2="1"><stop stop-color="#ff5140"/><stop offset="1" stop-color="#b60e17"/></linearGradient>
 <linearGradient id="goldButton" x2="0" y2="1"><stop stop-color="#ffe56b"/><stop offset="1" stop-color="#f49b08"/></linearGradient>
 <linearGradient id="brownButton" x2="0" y2="1"><stop stop-color="#a54b20"/><stop offset="1" stop-color="#4a1e12"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<image href="assets/images/background.png" x="0" y="0" width="1024" height="1536" preserveAspectRatio="none"/>
<!-- HAPKEK brand lockup -->
<image id="brandLockup" href="assets/images/brand-lockup.png" x="300" y="0" width="424" height="255" preserveAspectRatio="xMidYMid meet"/>
<!-- Japanese chochin lantern: detailed ribbed red paper, cream glow, wooden caps and tassel -->
<image href="assets/images/lantern.png" x="865" y="112" width="160" height="258" preserveAspectRatio="xMidYMid meet"/>
<!-- logo-side timer and sequence -->
<g filter="url(#shadow)">
 <rect x="28" y="258" width="290" height="82" rx="41" fill="#542619" stroke="#fff0d9" stroke-width="8"/>
 <circle cx="82" cy="299" r="23" fill="none" stroke="#fff5e8" stroke-width="8"/><path d="M82 283V299L96 299M74 267H90" stroke="#fff5e8" stroke-width="7" stroke-linecap="round"/>
 <text id="timerText" x="194" y="314" text-anchor="middle" font-size="48" font-weight="900" fill="#fff7e8">00:00.0</text>
 <rect x="664" y="258" width="332" height="82" rx="41" fill="#542619" stroke="#fff0d9" stroke-width="8"/>
 <text id="wordText" x="824" y="311" text-anchor="middle" font-size="43" font-weight="900" letter-spacing="7" fill="#ffc52f">_ _ _ _ _ _</text>
</g>
<!-- chef mascot, placed behind game board -->
<image id="chefMascot" href="assets/images/chef-mascot.png" x="365" y="350" width="294" height="430" preserveAspectRatio="xMidYMid meet"/>
<!-- griddle -->
<g filter="url(#shadow)">
 <path d="M83 625H941Q974 625 990 657L1020 813Q1028 842 996 848H27Q-5 848 5 814L37 657Q48 625 83 625Z" fill="#6a4b44" stroke="#392522" stroke-width="12"/>

</g>
<!-- light rays and sparks -->
<g opacity=".72" filter="url(#glow)" fill="#ffcf39">
 <path d="M512 625L480 870 510 870 535 625ZM400 640L450 850 466 850ZM620 640L555 850 575 850ZM280 660L400 850 420 850ZM740 660L610 850 632 850Z" opacity=".22"/>
 <path d="M67 752l12-30 12 30 30 12-30 12-12 30-12-30-30-12zM912 735l10-25 10 25 25 10-25 10-10 25-10-25-25-10zM250 604l8-22 8 22 22 8-22 8-8 22-8-22-22-8z"/>
</g>
<!-- six live pancake controls, single row matching reference -->
<g id="cakes">

 <ellipse class="cake-top" cx="140" cy="735" rx="74" ry="49" stroke="#ffd45a" stroke-width="5"/>
 <ellipse class="shine" cx="118" cy="714" rx="22" ry="7" opacity=".8"/>

</g>
<g class="cake" data-index="1" tabindex="0" role="button" aria-label="Covered pancake 2">
 <ellipse class="cake-side" cx="289" cy="759" rx="74" ry="24"/>
 <ellipse class="cake-top" cx="289" cy="735" rx="74" ry="49" stroke="#ffd45a" stroke-width="5"/>
 <ellipse class="shine" cx="267" cy="714" rx="22" ry="7" opacity=".8"/>
 <text class="letter" x="289" y="744" text-anchor="middle" dominant-baseline="middle" font-size="76" font-weight="1000" fill="#fff2dc">A</text>
</g>
<g class="cake" data-index="2" tabindex="0" role="button" aria-label="Covered pancake 3">
 <ellipse class="cake-side" cx="438" cy="759" rx="74" ry="24"/>
 <ellipse class="cake-top" cx="438" cy="735" rx="74" ry="49" stroke="#ffd45a" stroke-width="5"/>
 <ellipse class="shine" cx="416" cy="714" rx="22" ry="7" opacity=".8"/>
 <text class="letter" x="438" y="744" text-anchor="middle" dominant-baseline="middle" font-size="76" font-weight="1000" fill="#fff2dc">P</text>
</g>
<g class="cake" data-index="3" tabindex="0" role="button" aria-label="Covered pancake 4">
 <ellipse class="cake-side" cx="587" cy="759" rx="74" ry="24"/>
 <ellipse class="cake-top" cx="587" cy="735" rx="74" ry="49" stroke="#ffd45a" stroke-width="5"/>
 <ellipse class="shine" cx="565" cy="714" rx="22" ry="7" opacity=".8"/>
 <text class="letter" x="587" y="744" text-anchor="middle" dominant-baseline="middle" font-size="76" font-weight="1000" fill="#fff2dc">K</text>
</g>
<g class="cake" data-index="4" tabindex="0" role="button" aria-label="Covered pancake 5">
 <ellipse class="cake-side" cx="736" cy="759" rx="74" ry="24"/>
 <ellipse class="cake-top" cx="736" cy="735" rx="74" ry="49" stroke="#ffd45a" stroke-width="5"/>
 <ellipse class="shine" cx="714" cy="714" rx="22" ry="7" opacity=".8"/>
 <text class="letter" x="736" y="744" text-anchor="middle" dominant-baseline="middle" font-size="76" font-weight="1000" fill="#fff2dc">E</text>
</g>
<g class="cake" data-index="5" tabindex="0" role="button" aria-label="Covered pancake 6">
 <ellipse class="cake-side" cx="885" cy="759" rx="74" ry="24"/>
 <ellipse class="cake-top" cx="885" cy="735" rx="74" ry="49" stroke="#ffd45a" stroke-width="5"/>
 <ellipse class="shine" cx="863" cy="714" rx="22" ry="7" opacity=".8"/>
 <text class="letter" x="885" y="744" text-anchor="middle" dominant-baseline="middle" font-size="76" font-weight="1000" fill="#fff2dc">K</text>
</g>
</g>
<!-- Fixed, correctly ordered victory display; shown only after randomized cakes fade away -->
<g id="finalCakes" aria-hidden="true">
 <image href="assets/images/final-cakes.png" x="8" y="548" width="1008" height="336" preserveAspectRatio="none"/>
</g>
<text id="statusText" x="512" y="890" text-anchor="middle" font-size="27" font-weight="800" fill="#fff3db" stroke="#572b19" stroke-width="2" paint-order="stroke">Tap the cakes in order: H - A - P - K - E - K</text>
<!-- victory presentation, shown only after sequence complete -->
<g id="winGroup">
 <g filter="url(#shadow)">
  <path d="M95 930Q65 935 75 968L112 1010 72 1050Q58 1072 92 1070L180 1050H844L932 1070Q966 1072 952 1050L912 1010 949 968Q959 935 929 930Z" fill="#d71f27" stroke="#8f171a" stroke-width="8"/>
  <rect x="186" y="888" width="652" height="158" rx="78" fill="#fff8e7" stroke="#e5a33e" stroke-width="13"/>
  <rect x="202" y="903" width="620" height="128" rx="64" fill="#fffdf5" stroke="#ffdf9a" stroke-width="8"/>
  <text x="512" y="1005" text-anchor="middle" font-size="116" font-weight="1000" fill="#d51e24" stroke="#8b1b19" stroke-width="7" paint-order="stroke" filter="url(#shadow)">YOU WON!</text>
  <rect x="232" y="1070" width="560" height="150" rx="75" fill="url(#creamButton)" stroke="#df8c2d" stroke-width="10"/>
  <rect x="247" y="1084" width="530" height="120" rx="60" fill="none" stroke="#fff" stroke-width="6"/>
  <text x="512" y="1125" text-anchor="middle" font-size="37" font-weight="1000" fill="#5b2917">TIME</text>
  <text id="finalTimeSvg" x="512" y="1184" text-anchor="middle" font-size="77" font-weight="1000" fill="#4b2115">00:00.0</text>
 </g>
 <!-- buttons -->
 <g class="action" id="shareAction" tabindex="0" role="button" aria-label="Share">
  <rect class="button-base" x="58" y="1240" width="432" height="120" rx="60" fill="url(#creamButton)" stroke="#d47c28" stroke-width="9" filter="url(#shadow)"/>
  <rect x="72" y="1253" width="404" height="94" rx="47" fill="none" stroke="#fff" stroke-width="6"/>
  <g transform="translate(180 1300)" fill="#71321b"><circle cx="-20" cy="0" r="17"/><circle cx="25" cy="-25" r="17"/><circle cx="25" cy="25" r="17"/><path d="M-10 -8L12 -20M-10 8L12 20" stroke="#71321b" stroke-width="11"/></g>
  <text x="335" y="1317" text-anchor="middle" font-size="45" font-weight="900" fill="#542615">Share</text>
 </g>
 <g class="action" id="couponAction" tabindex="0" role="button" aria-label="Get Prize Coupon">
  <rect class="button-base" x="534" y="1240" width="432" height="120" rx="60" fill="url(#redButton)" stroke="#f0ae4f" stroke-width="9" filter="url(#shadow)"/>
  <rect x="548" y="1253" width="404" height="94" rx="47" fill="none" stroke="#ffb6a2" stroke-width="5"/>
  <path d="M594 1280L668 1268 686 1332 612 1344Z" fill="#ffe7a5" stroke="#9a551d" stroke-width="5"/><text x="642" y="1322" text-anchor="middle" font-size="48" font-weight="1000" fill="#c3271c">%</text>
  <text x="812" y="1297" text-anchor="middle" font-size="34" font-weight="900" fill="#fff6e8">Get Prize</text><text x="812" y="1335" text-anchor="middle" font-size="34" font-weight="900" fill="#fff6e8">Coupon</text>
 </g>
 <g class="action" id="againAction" tabindex="0" role="button" aria-label="Play Again">
  <rect class="button-base" x="58" y="1380" width="432" height="120" rx="60" fill="url(#goldButton)" stroke="#fff0b1" stroke-width="9" filter="url(#shadow)"/>
  <rect x="72" y="1393" width="404" height="94" rx="47" fill="none" stroke="#fff" stroke-width="5"/>
  <path d="M155 1410L155 1470Q155 1480 168 1472L222 1445Q234 1438 222 1430L168 1404Q155 1397 155 1410Z" fill="#71321b"/>
  <text x="330" y="1455" text-anchor="middle" font-size="39" font-weight="1000" fill="#552713">Play Again</text>
 </g>
 <g class="action" id="leaderAction" tabindex="0" role="button" aria-label="See Leaderboard">
  <rect class="button-base" x="534" y="1380" width="432" height="120" rx="60" fill="url(#brownButton)" stroke="#e4a15a" stroke-width="9" filter="url(#shadow)"/>
  <rect x="548" y="1393" width="404" height="94" rx="47" fill="none" stroke="#f4c17b" stroke-width="5"/>
  <path d="M610 1413H682L674 1458Q646 1484 618 1458Z" fill="#ffc849" stroke="#8e4c19" stroke-width="6"/><path d="M610 1425Q580 1412 591 1446Q600 1461 622 1458M682 1425Q712 1412 701 1446Q692 1461 670 1458" fill="none" stroke="#ffc849" stroke-width="9"/><path d="M646 1423l7 13 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z" fill="#fff1ba"/>
  <text x="813" y="1430" text-anchor="middle" font-size="34" font-weight="900" fill="#fff4df">See</text><text x="813" y="1468" text-anchor="middle" font-size="34" font-weight="900" fill="#fff4df">Leaderboard</text>
 </g>
</g>
<!-- play-state controls -->
<g id="playControls">
 <g class="action" id="newAction" tabindex="0" role="button" aria-label="New Game">
  <rect x="35" y="920" width="270" height="72" rx="36" fill="#fff2d8" stroke="#c66a25" stroke-width="6" filter="url(#shadow)"/>
  <text x="170" y="967" text-anchor="middle" font-size="34" font-weight="900" fill="#642c18">↻ New Game</text>
 </g>
 <g class="action" id="sharePlayAction" tabindex="0" role="button" aria-label="Share">
  <rect x="719" y="920" width="270" height="72" rx="36" fill="#fff2d8" stroke="#c66a25" stroke-width="6" filter="url(#shadow)"/>
  <text x="854" y="967" text-anchor="middle" font-size="34" font-weight="900" fill="#642c18">↗ Share</text>
 </g>
</g>
</svg><button id="musicToggle" class="music-toggle" type="button" aria-pressed="false" aria-label="Turn background music on" title="Turn background music on"><svg class="music-icon music-icon-on" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 19v10h9l12 10V9L16 19H7Z"/><path d="M34 17c5 4 5 10 0 14M38 11c9 7 9 19 0 26"/></svg><svg class="music-icon music-icon-off" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 19v10h9l12 10V9L16 19H7Z"/><path d="m34 18 10 12m0-12L34 30"/></svg></button></div></main>
